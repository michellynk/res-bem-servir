# Banco de dados local para desenvolvimento.
# Uso: docker compose up -d
services:
  db:
    image: postgres:17-alpine
    container_name: rbs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rbs
      POSTGRES_PASSWORD: rbs
      POSTGRES_DB: rbs
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - rbs-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rbs -d rbs"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  rbs-db-data:
